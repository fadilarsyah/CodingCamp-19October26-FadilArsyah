<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusTab</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar">
    <!-- <div class="nav-logo">
      <div class="nav-logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
      </div>
      <span class="nav-logo-text">FocusTab</span>
    </div> -->
    <div class="nav-actions">
      <button class="nav-btn" id="time-format-toggle" aria-label="Toggle time format">12H</button>
      <button class="nav-btn nav-btn-icon" id="theme-toggle" aria-label="Toggle dark mode">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- ===== HERO: CLOCK + GREETING ===== -->
  <header class="hero">
    <div class="clock-row">
      <span id="current-time" class="clock-time"></span>
      <span id="clock-ampm"   class="clock-ampm"></span>
    </div>
    <p id="current-date" class="hero-date"></p>
    <div class="greeting-pill">
      <span id="greeting-prefix" class="greeting-prefix"></span>
      <button class="greeting-name-btn" id="greeting-name-btn" aria-label="Edit your name">
        <span id="greeting-name">Friend</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ===== MAIN GRID ===== -->
  <main class="main-grid">

    <!-- ===== FOCUS TIMER ===== -->
    <section class="card" id="timer-card">
      <div class="card-header">
        <h2 class="section-title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          Focus Timer
        </h2>
        <!-- <span class="badge">Pomodoro</span> -->
      </div>

      <!-- Session tabs -->
      <div class="timer-tabs" role="tablist">
        <button class="timer-tab active" data-minutes="25" role="tab" aria-selected="true">25m Focus</button>
        <button class="timer-tab" data-minutes="5"  role="tab" aria-selected="false">5m Break</button>
        <button class="timer-tab" data-minutes="15" role="tab" aria-selected="false">15m Rest</button>
      </div>

      <!-- Circular progress -->
      <div class="timer-circle-wrap">
        <svg class="timer-svg" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="timer-track" cx="100" cy="100" r="88"/>
          <circle class="timer-progress" id="timer-progress-ring" cx="100" cy="100" r="88"/>
        </svg>
        <div class="timer-inner">
          <div class="timer-digits" id="timer-display">25:00</div>
          <div class="timer-label"  id="timer-label">READY</div>
        </div>
      </div>

      <!-- Controls -->
      <div class="timer-controls">
        <button class="btn btn-primary btn-start" id="timer-start">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Start
        </button>
        <button class="btn btn-outline" id="timer-stop">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18"/></svg>
          Stop
        </button>
        <button class="btn btn-outline" id="timer-reset">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
          </svg>
          Reset
        </button>
      </div>

      <div class="timer-footer">
        <span>Completed: <strong id="sessions-count">0</strong> sessions</span>
        <span id="sound-toggle-btn" class="sound-toggle" role="button" tabindex="0">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="sound-icon">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
          Sound On
        </span>
      </div>
    </section>

    <!-- ===== RIGHT COLUMN ===== -->
    <div class="right-col">

      <!-- ===== QUICK LINKS ===== -->
      <section class="card" id="links-card">
        <div class="card-header">
          <h2 class="section-title">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
            Quick Links
          </h2>
          <button class="btn-text-blue" id="add-link-header-btn">+ Add Link</button>
        </div>
        <div class="links-grid" id="links-grid"></div>
      </section>

      <!-- ===== TO-DO LIST ===== -->
      <section class="card" id="todo-card">
        <div class="card-header">
          <h2 class="section-title">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 11 12 14 22 4"/>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </svg>
            To-Do List
          </h2>
          <button class="btn-text-muted" id="clear-done-btn">Clear Done</button>
        </div>

        <form class="todo-form" id="todo-form">
          <input
            type="text"
            id="todo-input"
            class="input"
            placeholder="What would you like to achieve today?"
            autocomplete="off"
            maxlength="120"
          />
          <button type="submit" class="btn btn-primary">Add</button>
        </form>

        <!-- Filter tabs -->
        <div class="todo-tabs" role="tablist">
          <button class="todo-tab active" data-filter="all"    role="tab">All</button>
          <button class="todo-tab"        data-filter="active" role="tab">Active</button>
          <button class="todo-tab"        data-filter="done"   role="tab">Done</button>
        </div>

        <ul class="todo-list" id="todo-list"></ul>

        <p class="todo-count" id="todo-count"></p>
      </section>

    </div><!-- /right-col -->
  </main>

  <!-- ===== ADD LINK MODAL ===== -->
  <div class="modal-overlay" id="link-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="link-modal-title">
    <div class="modal">
      <h3 id="link-modal-title">Add Quick Link</h3>
      <input type="text" id="link-name" class="input" placeholder="Label (e.g. Google)" maxlength="30" />
      <input type="url"  id="link-url"  class="input" placeholder="https://example.com" />
      <div class="modal-actions">
        <button class="btn btn-primary" id="link-save-btn">Save</button>
        <button class="btn btn-outline" id="link-cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ===== EDIT TASK MODAL ===== -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <h3 id="modal-title">Edit Task</h3>
      <input type="text" id="modal-input" class="input" maxlength="120" />
      <div class="modal-actions">
        <button class="btn btn-primary" id="modal-save">Save</button>
        <button class="btn btn-outline" id="modal-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ===== EDIT NAME MODAL ===== -->
  <div class="modal-overlay" id="name-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="name-modal-title">
    <div class="modal">
      <h3 id="name-modal-title">Your Name</h3>
      <input type="text" id="name-input" class="input" placeholder="Enter your name" maxlength="30" />
      <div class="modal-actions">
        <button class="btn btn-primary" id="name-save-btn">Save</button>
        <button class="btn btn-outline" id="name-cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
